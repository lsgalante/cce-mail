[package]
name = "cce-mail"
version = "0.1.0"
edition = "2021"

[features]
# HTML mail rendering via embedded WPE WebKit (the same engine and embedding
# pattern as cce-browser's default build — see src/wpe/). Default, so a
# routine sweep rebuild ships the HTML view instead of silently reverting to
# text-only. Needs `pacman -S wpewebkit`.
default = ["wpe"]
wpe = ["dep:rustix", "dep:cce-wpe"]

[dependencies]
keyring = { version = "3", features = ["sync-secret-service"] }
cce-ui = { git = "https://github.com/lsgalante/cce-ui.git", rev = "8313adf7962de716ee8c7680981e0bae3b9fc980", features = ["file_dialog"] }
smithay-client-toolkit = "0.19.2"
calloop = "0.13.0"
calloop-wayland-source = "0.3.0"
wayland-client = { version = "0.31", features = ["system"] }
xkeysym = "0.2"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
imap = { version = "3.0.0-alpha.15", default-features = false, features = ["native-tls"] }
lettre = { version = "0.11", features = ["tokio1", "tokio1-native-tls"] }
native-tls = "0.2"
reqwest = { version = "0.12", features = ["json"] }
mail-parser = "0.11.5"
imap-proto = "0.16"
# Only used by the `wpe` backend, to hold GLib's changing pollfd set in one
# epoll fd that calloop can watch (same bridge as cce-browser's).
rustix = { version = "0.38", features = ["event"], optional = true }
# The WPE embedding shared with cce-browser (bindings, subclasses, GLib
# source, input); only with the `wpe` feature.
cce-wpe = { git = "https://github.com/lsgalante/cce-wpe.git", rev = "bb558869ef20c520de2910b9226f7c25cad721fe", optional = true }

# Headless smoke test for the embedded webview (no Wayland session needed).
[[example]]
name = "wpe_mail"
required-features = ["wpe"]

# Headless check that a press-drag-release over a message selects text.
[[example]]
name = "wpe_select"
required-features = ["wpe"]

